This guide explains how to implement native Apple Push Notifications (APNs) directly between your Django backend and your Flutter iOS app.

## 1. How It Works (The Architecture)

When you avoid FCM, the communication flow looks like this:

**Device Token Request:** App requests identity from Apple.
**Token Registration:** Unique token is sent to your Backend.
**Direct Delivery:** Backend talks to Apple API using your .p8 Key.

## 2. Apple Developer Portal Setup

To communicate with Apple's servers, you need an **APNs Auth Key**.

1.  **App ID**: Go to [Certificates, Identifiers & Profiles](https://developer.apple.com/account/resources/identifiers/list) and ensure your App ID has the **Push Notifications** capability enabled.
2.  **Create Key**: Go to the **Keys** section and create a new key.
    *   Name: \`Neighbor Service Push Key\`
    *   Enable: **Apple Push Notifications service (APNs)**.
3.  **Download .p8**: Download the resulting \`.p8\` file. 
    > [!IMPORTANT]
    > Save this file securely. You can only download it once.
4.  **Note Identifiers**: You will need:
    *   **Key ID** (10-character string found next to the key).
    *   **Team ID** (Found in the top-right of your Developer Portal).
    *   **Bundle ID** (e.g., \`com.neighborservice.app\`).

## 3. Xcode Configuration

1.  Open \`ios/Runner.xcworkspace\` in Xcode.
2.  Select the **Runner** project in the project navigator.
3.  Go to the **Signing & Capabilities** tab.
4.  Click **+ Capability** and add:
    *   **Push Notifications**
    *   **Background Modes** (Check **Remote notifications**)

## 4. Flutter Implementation

Since you are not using FCM, you can use the \`flutter_apns_only\` plugin or handle it via native code. However, the most robust way is to use \`firebase_messaging\` just as a wrapper for the APNs token (it can be configured to use APNs directly without the Firebase console).

Alternatively, you can access the APNs token directly in \`AppDelegate.swift\`:

\`\`\`swift
override func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
    let tokenParts = deviceToken.map { data in String(format: "%02.2hhx", data) }
    let token = tokenParts.joined()
    print("Device Token: \\(token)")
    // Send this token to your Django Backend
}
\`\`\`

## 5. Backend Implementation (Django)

You will need a Python library to talk to Apple's HTTP/2 API. I recommend \`gobiko.apns\` or \`django-push-notifications\`.

### Sending a message
Your backend will send a POST request to Apple's production server: \`https://api.push.apple.com/3/device/<device_token>\`

**Payload Requirement:**
\`\`\`json
{
  "aps": {
    "alert": {
      "title": "New Request",
      "body": "Someone needs help nearby!"
    },
    "sound": "default",
    "badge": 1
  }
}
\`\`\`

## Summary of Next Steps
1.  **User**: Obtain the \`.p8\` key from the Apple Developer portal.
2.  **User**: Provide the Key ID and Team ID to the developer.
3.  **Developer**: Implement a \`DeviceToken\` model in Django to store these iOS tokens.
4.  **Developer**: Add a logic to the \`send_notification\` utility to hit Apple's API for iOS users.`;
