name: Web Frontends CI (Angular)

on:
  push:
    branches: [ main, master, develop, staging ]
    paths:
      - 'frontend/admin-portal/**'
      - 'frontend/public-site/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'frontend/admin-portal/**'
      - 'frontend/public-site/**'
      - '.github/workflows/web-ci.yml'

jobs:
  build-admin-portal:
    name: Build Admin Portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin-portal

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/admin-portal/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

  build-public-site:
    name: Build Public Site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/public-site

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/public-site/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
