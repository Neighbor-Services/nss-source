name: Backend CI (Go)

on:
  push:
    branches: [ main, master, develop, staging ]
    paths:
      - 'backend-go/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'backend-go/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test-and-build:
    name: Test & Build Go Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: backend-go/go.sum

      - name: Install Dependencies
        run: go mod download

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit & Integration Tests
        run: go test -v -race ./...

      - name: Build Binary
        run: CGO_ENABLED=0 go build -v -ldflags="-w -s" -o bin/server ./cmd/server
