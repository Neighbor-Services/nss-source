<nav [class.scrolled]="isScrolled()">
  <div class="wrap nav-in">
    <a class="logo" routerLink="/" aria-label="Neighbor Service">
      <img class="mark" src="images/logo.png" alt="Neighbor Service">
      <span class="logo-word"><b>Neighbor</b><i>Service</i></span>
    </a>

    <div class="nav-links" [class.active]="isMobileMenuOpen()">
      <a routerLink="/services" routerLinkActive="active-link" (click)="closeMenu()">Services</a>
      <a routerLink="/about" routerLinkActive="active-link" (click)="closeMenu()">About Us</a>
      <a routerLink="/contact" routerLinkActive="active-link" (click)="closeMenu()">Contact</a>
      <a routerLink="/support" routerLinkActive="active-link" (click)="closeMenu()">Support</a>
    </div>

    <div class="nav-cta">
      <button class="nav-toggle" (click)="toggleMenu()" aria-label="Toggle navigation">
        @if (isMobileMenuOpen()) {
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        } @else {
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        }
      </button>
      <a class="btn btn-ghost" routerLink="/" fragment="providers">Become a Provider</a>
      <a class="btn btn-primary" routerLink="/" fragment="download">Get the App</a>
    </div>
  </div>
</nav>
